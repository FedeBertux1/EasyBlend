<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyBlend – 3D sculpting in your browser</title>
  <meta name="description" content="EasyBlend: free browser-based 3D sculpting tool for quick character and creature modeling, with STL/OBJ export.">
  <meta name="theme-color" content="#282828">
  <!-- Favicon dal logo nella cartella assets/ -->
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="apple-touch-icon" href="assets/logo.jpg">
  <!-- Handshake anticipato con la CDN: le librerie partono prima -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body data-mode="sculpt">
  <noscript>EasyBlend needs JavaScript to run.</noscript>
  <div id="app">

    <!-- BARRA SUPERIORE: modalità, undo/redo, pennello, lingua, aiuto -->
    <header id="topbar">
      <button id="btn-mode" data-i18n="mode" data-i18n-title="mode"></button>
      <button id="btn-undo" data-i18n-title="undo">↶</button>
      <button id="btn-redo" data-i18n-title="redo">↷</button>
      <strong id="tool-label"></strong>
      <label><span data-i18n="radius"></span> <input type="range" id="radius" step="0.5"><output id="radius-val"></output></label>
      <label><span data-i18n="strength"></span> <input type="range" id="strength" step="0.01"><output id="strength-val"></output></label>
      <label class="check"><input type="checkbox" id="symmetry" checked> <span data-i18n="sym"></span></label>
      <select id="lang" class="sp" aria-label="Language">
        <option value="en">English</option><option value="it">Italiano</option>
        <option value="es">Español</option><option value="fr">Français</option>
      </select>
      <button id="btn-help" data-i18n-title="shortcuts">?</button>
    </header>

    <!-- BARRA SINISTRA: pennelli (data-tool = chiave in BRUSHES e nel dizionario i18n) -->
    <nav id="toolbar">
      <button data-tool="draw" class="active"><span>●</span><i data-i18n="draw"></i></button>
      <button data-tool="smooth"><span>≈</span><i data-i18n="smooth"></i></button>
      <button data-tool="grab"><span>✥</span><i data-i18n="grab"></i></button>
      <button data-tool="flatten"><span>▬</span><i data-i18n="flatten"></i></button>
      <button data-tool="inflate"><span>◐</span><i data-i18n="inflate"></i></button>
      <button data-tool="pinch"><span>⋈</span><i data-i18n="pinch"></i></button>
      <button data-tool="mask"><span>◼</span><i data-i18n="mask"></i></button>
    </nav>

    <!-- VIEWPORT 3D (drag-and-drop di .glb .gltf .stl) -->
    <main id="viewport"></main>

    <!-- PANNELLO DESTRO: ogni <section> è un gruppo separato da un divisore (vedi style.css) -->
    <aside id="panel">
      <section>
        <h2 data-i18n="objects"></h2>
        <ul id="mesh-list"></ul>
        <div class="row"><button id="btn-import" data-i18n="import"></button><button id="btn-reset" data-i18n="reset"></button></div>
        <input type="file" id="file-input" accept=".glb,.gltf,.stl" multiple hidden>
      </section>

      <section class="dims">
        <h2 data-i18n="newPrim"></h2>
        <select id="prim-type">
          <option value="box" data-i18n="box"></option><option value="cylinder" data-i18n="cylinder"></option>
          <option value="cone" data-i18n="cone"></option><option value="torus" data-i18n="torus"></option>
          <option value="uvsphere" data-i18n="uvsphere"></option><option value="icosphere" data-i18n="icosphere"></option>
        </select>
        <div class="row">
          <label>X<input type="number" id="px" value="50" min="1"></label>
          <label>Y<input type="number" id="py" value="50" min="1"></label>
          <label>Z<input type="number" id="pz" value="50" min="1"></label>
        </div>
        <button id="btn-create" data-i18n="create"></button>
      </section>

      <section class="dims">
        <h2 data-i18n="active"></h2>
        <div class="row">
          <button data-gizmo="translate" class="active" data-i18n="move"></button>
          <button data-gizmo="rotate" data-i18n="rotate"></button>
          <button data-gizmo="scale" data-i18n="scale"></button>
        </div>
        <label class="check"><input type="checkbox" id="uniform" checked> <span data-i18n="prop"></span></label>
        <p id="field-title" class="field-title"></p>
        <div class="row xyz">
          <label>X<input type="number" id="ax" step="0.1"></label>
          <label>Y<input type="number" id="ay" step="0.1"></label>
          <label>Z<input type="number" id="az" step="0.1"></label>
        </div>
        <button id="btn-mask-clear" data-i18n="clearMask"></button>
      </section>

      <section>
        <h2 data-i18n="grid"></h2>
        <label class="check"><input type="checkbox" id="grid-vis" checked> <span data-i18n="showGrid"></span></label>
        <label class="check"><input type="checkbox" id="snap"> <span data-i18n="snap"></span></label>
        <label><span data-i18n="cell"></span> <input type="number" id="grid-step" value="10" min="1" step="1"></label>
      </section>

      <section>
        <h2 data-i18n="view"></h2>
        <select id="material">
          <option value="clay" data-i18n="clay"></option><option value="metal" data-i18n="metal"></option>
          <option value="wax" data-i18n="wax"></option>
        </select>
        <label class="check"><input type="checkbox" id="wireframe"> <span data-i18n="wire"></span></label>
        <div class="row"><button id="btn-focus" data-i18n="focus"></button><button id="btn-frame" data-i18n="frameAll"></button></div>
        <div class="row"><button id="btn-cam" data-i18n="resetCam"></button><button id="btn-shot" data-i18n="shot"></button></div>
      </section>

      <section>
        <h2 data-i18n="export"></h2>
        <div class="row"><button id="btn-stl">STL</button><button id="btn-obj">OBJ</button></div>
      </section>
    </aside>
  </div>

  <!-- Modale scorciatoie (la tabella viene generata da script.js, nella lingua attiva) -->
  <dialog id="help">
    <h2 data-i18n="shortcuts"></h2>
    <table id="help-body"></table>
    <form method="dialog"><button data-i18n="close"></button></form>
  </dialog>

  <!-- Three.js r147: ultima versione con build "classici". "defer" = download in parallelo, esecuzione in ordine dopo il parsing -->
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/TransformControls.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/STLLoader.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
  <script defer src="script.js"></script>
</body>
</html>
